name: tests

on:
  push:
    branches: [main, "**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      R_KEEP_PKG_SOURCE: yes
      # renv-style frozen CRAN snapshot: keeps haplo.stats / jmvcore
      # at fixed versions so a dependency upgrade never turns the golden tests
      # red on an unrelated push. Bump this date deliberately (and re-verify the
      # golden values) when you want to test against newer packages.
      RSPM: https://packagemanager.posit.co/cran/2026-07-01

    steps:
      - uses: actions/checkout@v4

      - name: Set up R 4.5
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5'
          use-public-rspm: true

      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # Imports (jmvcore, R6, nnet, haplo.stats, ggplot2, base64enc) and
          # Suggests (testthat, RProtoBuf) are read from DESCRIPTION
          # automatically. RProtoBuf matters: jmvcore's save/load is protobuf-
          # based, so without it both refresh suites skip and jamovi's
          # option-click / restore cycle goes untested.
          extra-packages: any::testthat

      # jmvcore/R/protobuf.R resolves its RProtoBuf wrappers at *jmvcore's* own
      # install time:
      #
      #   RProtoBuf_serialize <- if (requireNamespace('RProtoBuf', quietly=TRUE)) RProtoBuf::serialize
      #
      # RProtoBuf is only a Suggests of jmvcore, so nothing orders it before
      # jmvcore — and when it is missing at that moment the three wrappers bind
      # to NULL. Analysis$.save()/.load() then die with "could not find function
      # RProtoBuf_serialize", which their own try() swallows: the state file is
      # never written, the refresh suites see nothing restored, and ~10
      # assertions fail with no visible cause. Reinstalling from source once
      # RProtoBuf is present rebinds them (a prebuilt binary would just carry
      # over whatever the build machine baked in, hence type="source").
      - name: Rebuild jmvcore against RProtoBuf
        run: |
          Rscript -e 'install.packages("jmvcore", type = "source")'
          Rscript -e 'stopifnot(is.function(jmvcore:::RProtoBuf_serialize), is.function(jmvcore:::RProtoBuf_read), is.function(jmvcore:::RProtoBuf_new))'

      - name: Install SNPstats
        run: R CMD INSTALL --no-byte-compile .

      - name: Run test suite
        run: Rscript tests/run_tests.R
